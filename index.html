<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Movie Explorer</title>
<link rel="preconnect" href="https://image.tmdb.org" />
<link rel="stylesheet" href="css/style.css" />
</head>

<body>

<header class="site-header">
  <div class="nav-container">
    <a href="#/" class="logo">🎬 Movie<span>Explorer</span></a>

    <form id="search-form" class="search-form">
      <input type="text" id="search-input" placeholder="Search for movies..." autocomplete="off" />
      <button type="submit" aria-label="Search">🔍</button>
    </form>

    <div class="nav-actions">
      <select id="genre-select" class="genre-select">
        <option value="">Genres</option>
      </select>
      <a href="#/watchlist" class="nav-link">❤️ Watchlist</a>
      <button id="theme-toggle" class="theme-toggle" title="Toggle dark / light mode">🌙</button>
    </div>
  </div>
</header>

<main id="app">
  <div class="loader">Loading…</div>
</main>

<footer class="site-footer">
  <p>Movie Explorer &mdash; data & images provided by
    <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.
    This project is not endorsed or certified by TMDB.
  </p>
</footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>

</html>
